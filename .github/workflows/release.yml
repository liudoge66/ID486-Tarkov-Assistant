name: Build and publish Windows release

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: id486-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run synthetic release regressions
        run: python -m unittest discover -s tests -v
      - name: Build live-only executable
        run: python build.py
      - name: Verify packaged runtime and excluded video libraries
        shell: python
        run: |
          import subprocess,json
          from pathlib import Path
          from PyInstaller.archive.readers import CArchiveReader
          p=Path('dist/packaged-check.json').resolve()
          r=subprocess.run([str(Path('dist/ID486模拟助手.exe').resolve()),'--review-check',str(p)],timeout=60,creationflags=0x08000000)
          assert r.returncode==0 and json.loads(p.read_text(encoding='utf-8'))['ok']
          a=CArchiveReader('dist/ID486模拟助手.exe'); pyz=a.open_embedded_archive('PYZ.pyz')
          assert not any(n=='av' or n.startswith('av.') or n in ('video_test','video_reader') for n in pyz.toc)
          assert not any(any(k in n.lower() for k in ('avcodec','avformat','swresample','avutil','av.libs')) for n in a.toc)
          assert 'miniaudio' in pyz.toc
      - name: Assemble clean package
        run: python scripts/package_release.py
      - name: Preserve build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ID486-V0.3-Windows
          path: |
            dist/ID486-V0.3-Windows.zip
            dist/SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = (Get-Content release.json | ConvertFrom-Json).tag
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; refusing to replace assets." }
          gh release create $tag --target $env:GITHUB_SHA --title 'ID486 模拟助手 V0.3' --notes-file RELEASE_NOTES.md 'dist/ID486-V0.3-Windows.zip' 'dist/SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
